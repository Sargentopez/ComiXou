<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    /* Oculta el documento hasta que el chequeo anti-caché de más abajo
       confirme que esta build es la actual, o desista — ver ese bloque
       para el porqué. Sin esto, una copia vieja podía pintar un frame
       (la hoja ya "mal") antes de que la recarga forzada llegase a
       corregirla — Alberto (2026-09-29 v41.21): "sigue viendose mal" tras
       el primer arreglo, que sí recargaba pero no evitaba ese frame
       inicial. Tope de seguridad de 800ms puesto por script (ver abajo):
       nunca deja la pantalla en blanco para siempre si el chequeo no
       llega a resolver (sin red, servidor caído...). visibility (no
       display:none) para no alterar layout/medidas de nada. */
    html.cx-vcheck-pending body { visibility: hidden; }
  </style>
  <script>
    // Bootstrap del ocultamiento de arriba — lo primerísimo que se
    // ejecuta, antes incluso de la redirección de dominio, para que nada
    // llegue a pintar ni un frame antes de que quede ocultado.
    document.documentElement.classList.add('cx-vcheck-pending');
    var _cxVcheckSafety = setTimeout(function () {
      document.documentElement.classList.remove('cx-vcheck-pending');
    }, 800);
    function _cxVcheckDone() {
      clearTimeout(_cxVcheckSafety);
      document.documentElement.classList.remove('cx-vcheck-pending');
    }
  </script>
  <script>
    // Redirección permanente del dominio antiguo de GitHub Pages al dominio propio.
    if (location.hostname === 'sargentopez.github.io') {
      var _p = location.pathname.replace(/^\/ComiXou/, '') || '/';
      location.replace('https://comxow.com' + _p + location.search + location.hash);
    }
  </script>
  <!-- Cabeceras de caché "mejor esfuerzo" — no bastan por sí solas (los
       navegadores modernos no las respetan para decidir si sirven un
       documento de nivel superior desde caché), se dejan como refuerzo
       barato. El arreglo real es el script de más abajo. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>
    // Anti-caché del HTML del reproductor externo (Alberto, 2026-09-29: "la
    // hoja ya estaba correctamente rotada desde el inicio... eso hace que
    // la rotación que ocurre posteriormente no tenga sentido" — síntoma
    // compatible con estar viendo una build vieja cacheada de este mismo
    // fichero). El Service Worker de la app principal excluye a propósito
    // TODO /reader/ (ver sw.js, junto a "no interceptar el reproductor
    // externo") porque este reproductor se desregistra cualquier SW él
    // mismo (ver más abajo) para funcionar como página suelta, embebible en
    // cualquier sitio, sin depender de un SW con scope propio — por eso no
    // puede reutilizar el arreglo "network-first + cache:no-store" que ya
    // protege al HTML/JS/CSS de la app principal contra el mismo problema
    // (GitHub Pages sirve estos ficheros con cabeceras de caché de varios
    // minutos — ver ese mismo comentario en sw.js). Los SUB-recursos de
    // este documento (reader.js, reader.css...) ya se libran de esto
    // porque llevan `?v=` — cada versión nueva es una URL distinta que el
    // navegador nunca ha visto, así que no puede haber copia vieja en
    // caché. Pero el propio index.html no tiene ningún `?v=` posible (es
    // el punto de entrada, su URL la escribe/comparte/guarda el propio
    // Alberto o sus lectores) — así que aquí, en cuanto carga, se comprueba
    // a mano: pide sin caché (no-store + query nueva de por sí) un fichero
    // de una sola línea con la versión REAL recién publicada (version.txt).
    // Si no coincide con la que este documento cree tener, es que esta
    // copia es vieja — fuerza entonces una recarga real, con una query que
    // el navegador jamás ha visto (imposible que haya caché de eso), así
    // que la recarga sí trae la versión nueva de verdad. Solo se reintenta
    // UNA vez por pestaña (nunca en bucle, ni aunque la recarga fallase en
    // volver a traer la versión nueva) y ocurre ANTES de que el lector
    // empiece a descargar la obra en sí, así que nunca duplica esa descarga
    // (ver nota de _creditsClick en reader.js sobre por qué evitar recargas
    // innecesarias). En cuanto la página ya cargó, limpia esa query de la
    // barra de direcciones (history.replaceState, sin recargar nada) para
    // que un enlace copiado o compartido después quede limpio.
    //
    // IMPORTANTE — el documento sigue OCULTO (ver el bloque de arriba)
    // hasta que esto llama a _cxVcheckDone(): en el caso de desajuste NO
    // se llama (se deja oculto hasta que la recarga forzada reemplaza el
    // documento entero) — así el usuario nunca ve ni un frame de la copia
    // vieja; en cualquier otro caso (coincide, no aplica, o falla la
    // comprobación) si se llama, para no dejar la pantalla en blanco.
    (function () {
      var READER_BUILD = '41.55';
      var RETRY_KEY = 'cxReaderCacheRetry';
      if (/[?&]_cb=/.test(location.search)) {
        var clean = location.href.replace(/([?&])_cb=[^&]*&?/, '$1').replace(/[?&]$/, '');
        history.replaceState(null, '', clean);
      }
      // Solo tiene sentido con origen http(s) real (donde de verdad existe
      // una caché HTTP de la que protegerse). Abierto en local por
      // file:// (pruebas, depuración manual) fetch() a un fichero local
      // SIEMPRE falla por CORS (origen "null") — no hay caché que defender
      // ahí, así que ni hace falta el chequeo ni conviene ensuciar la
      // consola con ese error inevitable.
      if (location.protocol !== 'http:' && location.protocol !== 'https:') { _cxVcheckDone(); return; }
      var alreadyRetried = false;
      try { alreadyRetried = sessionStorage.getItem(RETRY_KEY) === '1'; } catch (_) {}
      if (alreadyRetried) { _cxVcheckDone(); return; }
      fetch('version.txt?_=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.text() : ''; })
        .then(function (v) {
          v = (v || '').trim();
          if (v && v !== READER_BUILD) {
            try { sessionStorage.setItem(RETRY_KEY, '1'); } catch (_) {}
            var sep = location.href.indexOf('?') === -1 ? '?' : '&';
            location.replace(location.href + sep + '_cb=' + Date.now().toString(36));
            return; // sigue oculto — la recarga va a reemplazar el documento entero
          }
          _cxVcheckDone();
        })
        .catch(function () { _cxVcheckDone(); });
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Comxow — Lector</title>
  <!-- TEMPORAL: bloquea la indexación en buscadores mientras la app esté en
       fase previa al lanzamiento. Quitar esta línea cuando se quiera permitir
       la indexación pública. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111111">

  <!-- Open Graph / WhatsApp / Telegram / Twitter preview -->
  <!-- CONFIRMADO EN DISPOSITIVO REAL: sin og:title, WhatsApp NO muestra la
       imagen en absoluto — cae directamente a texto plano (título de la
       pestaña + dominio + mensaje), sin tarjeta. No es opcional: hace falta
       algún og:title para que la imagen aparezca. Se deja con el mínimo de
       texto posible (el propio nombre, sin eslogan ni descripción añadida)
       en vez de quitarlo del todo. -->
  <meta property="og:type"        content="website">
  <meta property="og:title"       content="Comxow">
  <meta property="og:image"       content="https://comxow.com/og-card.png?v=41.55">
  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="388">
  <meta property="og:url"         content="https://comxow.com/reader/">
  <meta name="twitter:card"       content="summary_large_image">
  <meta name="twitter:image"      content="https://comxow.com/og-card.png?v=41.55">

  <!-- Icono de pestaña — antes ausente aquí (el lector nunca lo declaraba,
       a diferencia de la app principal), así que cada carga pedía de más
       un /favicon.ico inexistente. Mismos ficheros que ya usa la app. -->
  <link rel="icon" type="image/svg+xml" href="../icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
  <link rel="apple-touch-icon" href="../icon-192.png">

  <!-- Fuentes autoalojadas (WOFF2) — sin dependencia de conectividad, sin llamadas a terceros -->
  <link rel="stylesheet" href="../fonts/typefaces.css">
  <link rel="stylesheet" href="reader.css?v=41.55">
</head>
<script src="../js/i18n.js?v=41.55"></script>
<script>
  if ('serviceWorker' in navigator)
    navigator.serviceWorker.getRegistrations().then(r => r.forEach(s => s.unregister()));
</script>
<body>

  <!-- CARGA -->
  <div id="loadingScreen" class="loading-screen">
    <div class="loading-logo">
      <img src="../loading-icon.png?v=41.55" data-i18n-alt="loadingAlt" alt="Cargando" style="height:40px;width:auto;">
      <img src="../logo.svg" alt="Comxow" style="height:40px;width:auto;">
    </div>
    <div id="loadingMsg" class="loading-msg" data-i18n="reader_loadingWork">Cargando obra...</div>
    <div class="loading-progress-wrap">
      <div class="loading-progress-bar" id="loadingBar"></div>
    </div>
    <div class="loading-progress-label" id="loadingLabel"></div>
  </div>

  <!-- ERROR -->
  <div id="errorScreen" class="error-screen hidden">
    <div class="error-card">
      <div class="error-icon">📭</div>
      <h2 data-i18n="reader_workNotAvailableTitle">Obra no disponible</h2>
      <p id="errorMsg" data-i18n="reader_errorWorkNotFound">Esta obra no existe o no está publicada.</p>
      <a href="javascript:history.back()" class="btn-yellow" data-i18n="intro_back">Volver</a>
    </div>
  </div>

  <!-- REPRODUCTOR -->
  <div id="readerApp" class="reader-app hidden">

    <canvas id="readerCanvas"></canvas>

    <!-- Contenedor scroll para modos horizontal/vertical -->
    <div id="scrollReader"></div>

    <!-- Esquina superior izquierda: fullscreen -->
    <button id="fullscreenToggle" class="corner-btn corner-tl" data-i18n-aria="reader_fullscreenLabel" aria-label="Pantalla completa">[ ]</button>

    <!-- Esquina superior derecha: cerrar -->
    <button id="closeBtn" class="corner-btn corner-tr" data-i18n-aria="reader_closeLabel" aria-label="Cerrar">&#x2715;</button>

    <!-- Esquina inferior izquierda: abrir barra de navegación por hoja -->
    <button id="pageNavToggle" class="corner-btn corner-bl" data-i18n-aria="reader_goToPageLabel" aria-label="Ir a hoja">1/1</button>

    <!-- Esquina inferior derecha: descargar para lectura offline -->
    <button id="offlineDlBtn" class="corner-btn corner-br hidden" data-i18n-aria="reader_downloadOfflineTitle" aria-label="Descargar para leer sin conexión">&#x2B07;</button>

    <!-- Scrim + barra inferior: seleccionar hoja arrastrando -->
    <div id="pageNavScrim" class="page-nav-scrim hidden"></div>
    <div id="pageNavBar" class="page-nav-bar hidden">
      <div class="page-nav-bar-label" id="pageNavLabel">Hoja 1 de 1</div>
      <input type="range" id="pageNavSlider" class="page-nav-slider" min="1" max="1" value="1" step="1" data-i18n-aria="reader_selectPageLabel" aria-label="Seleccionar hoja">
    </div>


    <!-- Toast de instrucciones de navegación -->
    <div id="readerToast" class="reader-toast"></div>

    <!-- Versión — oculta (se superponía con el nuevo botón inferior
         izquierdo de navegación por hoja, corner-bl). Se deja en el DOM
         por si hace falta reactivarla para pruebas: basta con quitar
         "display:none;" del style. -->
    <div id="readerVersion" style="display:none;position:fixed;bottom:8px;left:8px;font-size:11px;color:rgba(255,255,255,0.7);background:rgba(0,0,0,0.45);padding:2px 7px;border-radius:8px;z-index:9999;pointer-events:none;">v30.99</div>

  </div>

  <script src="../js/pako.min.js?v=41.55"></script>
  <script src="../js/UPNG.js?v=41.55"></script>
  <script src="../js/fullscreen.js?v=41.55"></script>
  <script src="../js/logo-data.js?v=41.55"></script>
  <script src="../js/icon-data.js?v=41.55"></script>
  <script src="../js/anim-clock.js?v=41.55"></script>
  <script src="reader.js?v=41.55"></script>
</body>
</html>
