<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>
    // Redirección permanente del dominio antiguo de GitHub Pages al dominio propio.
    if (location.hostname === 'sargentopez.github.io') {
      var _p = location.pathname.replace(/^\/ComiXou/, '') || '/';
      location.replace('https://comxow.com' + _p + location.search + location.hash);
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Comxow — Lector</title>
  <meta name="theme-color" content="#111111">

  <!-- Open Graph / WhatsApp / Telegram / Twitter preview -->
  <!-- CONFIRMADO EN DISPOSITIVO REAL: sin og:title, WhatsApp NO muestra la
       imagen en absoluto — cae directamente a texto plano (título de la
       pestaña + dominio + mensaje), sin tarjeta. No es opcional: hace falta
       algún og:title para que la imagen aparezca. Se deja con el mínimo de
       texto posible (el propio nombre, sin eslogan ni descripción añadida)
       en vez de quitarlo del todo. -->
  <meta property="og:type"        content="website">
  <meta property="og:title"       content="Comxow">
  <meta property="og:image"       content="https://comxow.com/og-card.png?v=38.52">
  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="388">
  <meta property="og:url"         content="https://comxow.com/reader/">
  <meta name="twitter:card"       content="summary_large_image">
  <meta name="twitter:image"      content="https://comxow.com/og-card.png?v=38.52">

  <!-- Fuentes autoalojadas (WOFF2) — sin dependencia de conectividad, sin llamadas a terceros -->
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="reader.css?v=38.52">
</head>
<script>
  if ('serviceWorker' in navigator)
    navigator.serviceWorker.getRegistrations().then(r => r.forEach(s => s.unregister()));
</script>
<body>

  <!-- CARGA -->
  <div id="loadingScreen" class="loading-screen">
    <div class="loading-logo">
      <img src="../loading-icon.png?v=38.52" alt="Cargando" style="height:40px;width:auto;">
      <img src="../logo.svg" alt="Comxow" style="height:40px;width:auto;">
    </div>
    <div id="loadingMsg" class="loading-msg">Cargando obra...</div>
    <div class="loading-progress-wrap">
      <div class="loading-progress-bar" id="loadingBar"></div>
    </div>
    <div class="loading-progress-label" id="loadingLabel"></div>
  </div>

  <!-- ERROR -->
  <div id="errorScreen" class="error-screen hidden">
    <div class="error-card">
      <div class="error-icon">📭</div>
      <h2>Obra no disponible</h2>
      <p id="errorMsg">Esta obra no existe o no está publicada.</p>
      <a href="javascript:history.back()" class="btn-yellow">Volver</a>
    </div>
  </div>

  <!-- REPRODUCTOR -->
  <div id="readerApp" class="reader-app hidden">

    <canvas id="readerCanvas"></canvas>

    <!-- Contenedor scroll para modos horizontal/vertical -->
    <div id="scrollReader"></div>

    <!-- Esquina superior izquierda: fullscreen -->
    <button id="fullscreenToggle" class="corner-btn corner-tl" aria-label="Pantalla completa">[ ]</button>

    <!-- Esquina superior derecha: cerrar -->
    <button id="closeBtn" class="corner-btn corner-tr" aria-label="Cerrar">&#x2715;</button>

    <!-- Esquina inferior izquierda: abrir barra de navegación por hoja -->
    <button id="pageNavToggle" class="corner-btn corner-bl" aria-label="Ir a hoja">1/1</button>

    <!-- Esquina inferior derecha: descargar para lectura offline -->
    <button id="offlineDlBtn" class="corner-btn corner-br hidden" aria-label="Descargar para leer sin conexión">&#x2B07;</button>

    <!-- Scrim + barra inferior: seleccionar hoja arrastrando -->
    <div id="pageNavScrim" class="page-nav-scrim hidden"></div>
    <div id="pageNavBar" class="page-nav-bar hidden">
      <div class="page-nav-bar-label" id="pageNavLabel">Hoja 1 de 1</div>
      <input type="range" id="pageNavSlider" class="page-nav-slider" min="1" max="1" value="1" step="1" aria-label="Seleccionar hoja">
    </div>


    <!-- Toast de instrucciones de navegación -->
    <div id="readerToast" class="reader-toast"></div>

    <!-- Versión — oculta (se superponía con el nuevo botón inferior
         izquierdo de navegación por hoja, corner-bl). Se deja en el DOM
         por si hace falta reactivarla para pruebas: basta con quitar
         "display:none;" del style. -->
    <div id="readerVersion" style="display:none;position:fixed;bottom:8px;left:8px;font-size:11px;color:rgba(255,255,255,0.7);background:rgba(0,0,0,0.45);padding:2px 7px;border-radius:8px;z-index:9999;pointer-events:none;">v30.97</div>

  </div>

  <script src="../js/pako.min.js"></script>
  <script src="../js/UPNG.js"></script>
  <script src="../js/fullscreen.js?v=38.52"></script>
  <script src="../js/logo-data.js"></script>
  <script src="../js/icon-data.js"></script>
  <script src="../js/anim-clock.js?v=38.52"></script>
  <script src="reader.js?v=38.52"></script>
</body>
</html>
