  <!-- Ventana de bienvenida/condiciones de uso (ver #cxIntro más abajo, justo tras
       <body>). Estilos aquí para no depender de ningún JS: debe pintarse ya con
       el primer parseo del HTML, antes incluso de que carguen los ~25 scripts
       de más abajo (ninguno tiene defer/async, así que bloquean el parseo). -->
  <style>
    #cxIntro {
      position: fixed; inset: 0; z-index: 9999999;
      /* Fondo oscuro semitransparente — mismo valor que _cxLoadOverlayShow en
         utils.js (rgba(0,0,0,0.82)), para que se intuya la app detrás. */
      background: rgba(0,0,0,0.82);
      display: flex; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box;
      transition: opacity .35s ease;
      touch-action: none;
    }
    #cxIntro.cx-hidden { opacity: 0; pointer-events: none; }
    #cxIntroCard {
      display: flex; flex-direction: column; align-items: center;
      width: auto; text-align: center;
      background: #fff;
      border-radius: var(--radius, 12px);
      padding: 9px 9px 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.45);
    }
    #cxIntroCard.cx-no-frame {
      background: transparent;
      padding: 0;
      box-shadow: none;
    }
    /* Mismo ancho para la animación y el botón (la línea del checkbox se centra
       por su propio ancho natural, ver más abajo — forzarla a 220px hacía que
       el texto envolviera línea a línea ocupando todo el ancho, y entonces
       "centrado" no tenía ningún efecto visible). */
    /* Ancho de la animación: 220px. El botón mide 167px — el ancho REAL
       pintado del conjunto checkbox+texto (medido con Playwright/Chromium
       sobre el render real: range.getBoundingClientRect() de todo el
       contenido del label, no la caja de 220px que lo contiene — el texto
       envuelve a 2 líneas centradas y ninguna llega a ocupar los 220px). */
    #cxIntroCard img {
      width: 220px;
      height: auto; margin-bottom: 7px;
      border-radius: var(--radius, 12px);
    }
    #cxIntroGate { display: flex; flex-direction: column; align-items: center; }
    #cxIntroGate label {
      display: block;
      width: 220px;
      text-align: center; font-family: var(--font-body, sans-serif);
      color: var(--ink, #2C1810); font-size: .92rem; line-height: 1.5;
      margin: 2px 0 9px;
      cursor: pointer;
    }
    /* Checkbox dibujado a medida (no el nativo del navegador): el control
       nativo reserva relleno interno invisible propio de cada navegador
       alrededor de su marca visible. Se coloca como contenido EN LÍNEA junto
       al texto (no como columna de una fila flex) para que, si el texto
       envuelve a varias líneas, cada línea —incluida la primera, con el
       checkbox— se centre como un único bloque de párrafo, en vez de
       centrarse el checkbox y el texto por separado en columnas distintas. */
    #cxIntroGate input[type="checkbox"] {
      -webkit-appearance: none; appearance: none;
      vertical-align: middle;
      margin: 0 6px 2px 0;
      cursor: pointer;
      width: 18px; height: 18px;
      border: 2px solid var(--black, #1A1A1A);
      border-radius: 4px;
      background: #fff;
      position: relative;
    }
    #cxIntroGate input[type="checkbox"]:checked { background: var(--black, #1A1A1A); }
    #cxIntroGate input[type="checkbox"]:checked::after {
      content: '';
      position: absolute; left: 5px; top: 1px;
      width: 4px; height: 9px;
      border: solid #fff; border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    #cxIntroGate a { color: var(--blue, #0046CC); font-weight: 700; text-decoration: underline; }
    #cxIntroBtn { width: 167px; justify-content: center; }
    #cxIntroBtn:disabled { opacity: .45; cursor: not-allowed; }

  <!-- Ventana de bienvenida / condiciones de uso — bloqueante en primera visita,
       solo animación mientras cargan las obras en visitas posteriores.
       Vive fuera de #appView (igual que _cxLoadOverlay en utils.js) y se pinta
       con el primer parseo del HTML, antes de que se ejecute ningún script. -->
  <div id="cxIntro">
    <div id="cxIntroCard">
      <img src="intro-anim.png?v=39.08" alt="Comxow — IDEA Y COMPARTE">
      <div id="cxIntroGate">
        <label>
          <input type="checkbox" id="cxIntroCheck">
          <span data-i18n="intro_acceptPrefix">He leído y acepto las</span>
          <a href="#terms" target="_blank" rel="noopener" data-i18n="intro_termsLink">condiciones de uso</a>
        </label>
        <button type="button" id="cxIntroBtn" class="btn btn-primary" disabled data-i18n="intro_continue">Continuar</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var KEY = 'cx_terms_accepted_v1';
      var ov   = document.getElementById('cxIntro');
      var gate = document.getElementById('cxIntroGate');
      var chk  = document.getElementById('cxIntroCheck');
      var btn  = document.getElementById('cxIntroBtn');
      var hash = window.location.hash.replace('#', '');

      // La propia página de condiciones de uso nunca debe quedar bloqueada por
      // esta ventana (si no, sería imposible leerlas para poder aceptarlas) —
      // se abre en pestaña nueva desde el enlace de abajo, así que aquí basta
      // con no pintar nada encima cuando se entra directamente a #terms.
      if (hash === 'terms') { ov.style.display = 'none'; return; }

      var already = !!localStorage.getItem(KEY);
      // Duración del primer bucle completo de intro-anim.png: 42 frames a 71ms
      // + 1 frame de 500ms + el frame final de 6000ms (COMXOW / IDEA Y COMPARTE)
      // = 9482ms. Si el archivo de la animación cambia alguna vez, este número
      // hay que recalcularlo a mano (no hay forma estándar de leer la duración
      // de los frames de un APNG desde <img> con JS del navegador).
      var ANIM_LOOP_MS = 9482;
      // Mantener la animación al menos hasta el final de su primer bucle menos
      // 5s — así se evita que, si las obras ya cargaron, el usuario tenga que
      // esperar el aguante completo de 6s del último frame para poder entrar.
      var MIN_SHOW_MS = ANIM_LOOP_MS - 5000; // 4482ms
      var startedAt = Date.now();

      function hide() {
        ov.classList.add('cx-hidden');
        setTimeout(function () { ov.style.display = 'none'; }, 350);
      }

      // Oculta respetando el mínimo anterior — si ya se ha cumplido, oculta ya;
      // si no, espera lo que falte. Solo se usa en el caso "ya aceptado antes"
      // (ver window._cxSplashReady más abajo); la ventana de aceptación de
      // condiciones nunca se oculta sola, la cierra la propia persona.
      function hideRespectingMinimum() {
        var remaining = MIN_SHOW_MS - (Date.now() - startedAt);
        if (remaining > 0) setTimeout(hide, remaining);
        else hide();
      }

      if (already) {
        // Sin marco blanco cuando ya se habían aceptado las condiciones —
        // solo la animación flotando sobre el fondo oscuro.
        document.getElementById('cxIntroCard').classList.add('cx-no-frame');
        gate.style.display = 'none';
        // Red de SEGURIDAD, último recurso: si por lo que sea ninguna vista
        // llama a _cxSplashReady (ver router.js / home.js), no dejar la app
        // bloqueada para siempre.
        //
        // BUG QUE ESTO CORRIGE (reportado por Alberto: la animación
        // desaparecía sin que las obras estuvieran cargadas, dejando ver
        // "Aún no hay obras publicadas" aunque sí las hubiera): esta red de
        // seguridad estaba fijada a MIN_SHOW_MS + 3000 = 7482ms — un número
        // MENOR que el tiempo que _loadPublishedWorks (home.js) puede tardar
        // de verdad en darse por vencida ante un fallo de red. Con conexión
        // lenta o sin conexión, esta red de seguridad se disparaba ANTES de
        // que esa carga real hubiera tenido ocasión de terminar (con éxito o
        // con error) y llamar a _cxSplashReady() por sí misma — la animación
        // desaparecía antes de tiempo, dejando debajo lo que hubiera en ese
        // instante (típicamente nada aún pintado), y encima con el mensaje
        // de "no hay obras" tal cual — del todo INCORRECTO cuando la causa
        // real es que la carga no ha terminado o ha fallado por conexión
        // (ver home.js, _homeLoadError).
        //
        // Por eso este número tiene que ser MAYOR que _HOME_LOAD_TIMEOUT_MS
        // (home.js — el límite TOTAL que se le da a esa carga real antes de
        // darla por fallida), no un valor suelto: si ese número cambia algún
        // día en home.js, este de aquí también hay que revisarlo.
        var HOME_LOAD_TIMEOUT_MS = 10000; // debe coincidir con _HOME_LOAD_TIMEOUT_MS en home.js
        setTimeout(hide, Math.max(MIN_SHOW_MS, HOME_LOAD_TIMEOUT_MS) + 2000);
      } else {
        chk.addEventListener('change', function () { btn.disabled = !chk.checked; });
        btn.addEventListener('click', function () {
          if (!chk.checked) return;
          localStorage.setItem(KEY, '1');
          hide();
        });
      }

      // Señal que llaman router.js (resto de vistas) y home.js (_loadPublishedWorks,
      // solo en la vista home): "ya se puede ocultar la ventana". Si la persona
      // aún no ha aceptado, la ventana debe permanecer — es intencionalmente
      // bloqueante — así que esta señal se ignora hasta que acepte. Si ya había
      // aceptado, se respeta igualmente el mínimo de MIN_SHOW_MS de arriba.
      window._cxSplashReady = function () {
        if (!already) return;
        hideRespectingMinimum();
      };
    })();
  </script>

  <!-- Arrancar -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      Router.start();
    });
    // Al volver del reader con history.back(), recuperar fullscreen si la app estaba en él
    window.addEventListener('pageshow', function(e) {
      if (sessionStorage.getItem('cx_was_fs') === '1') {
        sessionStorage.removeItem('cx_was_fs');
        // Solo pedir fullscreen si no estamos ya en él
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          const el = document.documentElement;
          const req = el.requestFullscreen || el.webkitRequestFullscreen;
          if (req) req.call(el).catch(() => {});
        }
      }
      // Bfcache: al leer una obra desde index o Mis Creaciones se navega con
      // window.location a reader/index.html (documento aparte); al volver
      // con el botón/gesto atrás, el navegador restaura ESTE index.html
      // desde la bfcache tal cual estaba — no se ejecuta Router.start() ni
      // ningún fetch nuevo, así que la lista se quedaba con los datos de
      // antes de entrar al reader. e.persisted distingue esta restauración
      // de una carga nueva de verdad (que ya recarga fresco solo con
      // Router.start(), sin necesidad de esto).
      if (e.persisted) {
        if (document.getElementById('worksGrid')) {
          if (typeof homeInvalidateCache === 'function') homeInvalidateCache();
          if (typeof _loadPublishedWorks === 'function') _loadPublishedWorks();
        } else if (document.getElementById('myWorksList')) {
          if (typeof _mcRenderList === 'function') _mcRenderList();
          if (typeof _mcSyncCloudDates === 'function') _mcSyncCloudDates();
        }
      }
    });
  </script>
